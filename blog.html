<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Read a Blogify story.">
<title>Story — Blogify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<header class="site-header">
<nav class="navbar container">
<a class="brand" href="index.html"><span class="brand-mark">B</span><span>Blogify</span></a>
<div class="nav-links">
<a href="index.html">Home</a><a href="index.html#explore">Explore</a><a href="dashboard.html">Dashboard</a><a href="create-blog.html">Create Blog</a>
<span class="nav-divider"></span><button class="theme-toggle" type="button" aria-label="Toggle theme">☾</button><a href="login.html">Login</a>
</div>
</nav>
</header>
<main class="container article-page">
<a class="text-link" href="index.html#explore">← Back to stories</a>
<article id="article" class="article-shell">
<p class="loading-state">Loading story…</p>
</article>
</main>
<footer class="footer"><div class="container footer-inner"><span>Blogify</span><p>Module 3 · Database Integration</p></div></footer>
<div id="toast" class="toast" role="status"></div>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const article = document.getElementById("article");
  const id = new URLSearchParams(location.search).get("id");
  if (!id) {
    article.innerHTML = "<h1>Story not found</h1><p>Choose a published story from the Explore page.</p>";
    return;
  }
  try {
    const res = await fetch("http://localhost:5000/api/blogs/" + encodeURIComponent(id));
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Unable to load story.");
    const blog = data.blog;
    article.innerHTML = `
      <div class="article-kicker">${escapeArticle(blog.category)} · ${new Date(blog.createdAt).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</div>
      <h1>${escapeArticle(blog.title)}</h1>
      <p class="article-lede">${escapeArticle(blog.description)}</p>
      <div class="article-author"><span class="author-avatar">${escapeArticle((blog.authorName||"BU").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())}</span><span><strong>${escapeArticle(blog.authorName)}</strong><small>Published on Blogify</small></span></div>
      ${blog.image ? '<img class="article-cover" src="' + escapeAttribute(blog.image) + '" alt="' + escapeAttribute(blog.title) + '">' : ''}
      <div class="article-content">${escapeArticle(blog.content).replace(/\n/g,"<br><br>")}</div>
      <div class="article-tags">${(blog.tags||[]).map(tag => '<span>#'+escapeArticle(tag)+'</span>').join("")}</div>`;
  } catch (error) {
    article.innerHTML = "<h1>Unable to load story</h1><p>" + escapeArticle(error.message) + "</p>";
  }
  function escapeArticle(value){return String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
  function escapeAttribute(value){return escapeArticle(value).replace(/'/g,"&#039;")}
});
</script>
</body></html>
