<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account — Blogify</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="auth-page" data-page="register"><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">B</span><span>Blogify</span></a><section class="auth-card"><span class="eyebrow">Join the community</span><h1>Create your account</h1><p class="auth-sub">Start reading and publishing your own stories.</p><form id="register-form" novalidate><label>Full name<input id="reg-name" type="text" placeholder="Your full name" required><small class="field-error"></small></label><label>Email address<input id="reg-email" type="email" placeholder="you@example.com" required><small class="field-error"></small></label><label>Password<div class="password-wrap"><input id="reg-password" type="password" placeholder="At least 8 characters" minlength="8" required><button type="button" class="password-toggle" data-target="reg-password">Show</button></div><div class="strength"><span id="strength-bar"></span></div><small id="strength-text">Use 8+ characters with numbers and symbols.</small><small class="field-error"></small></label><label>Confirm password<input id="reg-confirm" type="password" placeholder="Repeat your password" required><small class="field-error"></small></label><label class="check terms"><input id="terms" type="checkbox" required><span>I agree to the terms and community guidelines.</span></label><button class="btn btn-full" type="submit">Create account <span>→</span></button></form><p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p></section><p class="auth-foot">© 2026 Blogify · Frontend demo</p></main><div id="toast" class="toast" role="status"></div><script src="js/app.js"></script></body></html>
