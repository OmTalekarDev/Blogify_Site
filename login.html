<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — Blogify</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="auth-page" data-page="login"><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">B</span><span>Blogify</span></a><section class="auth-card"><span class="eyebrow">Welcome back</span><h1>Sign in to Blogify</h1><p class="auth-sub">Continue reading, writing and sharing ideas.</p><form id="login-form" novalidate><label>Email address<input id="login-email" type="email" placeholder="you@example.com" required><small class="field-error"></small></label><label>Password<div class="password-wrap"><input id="login-password" type="password" placeholder="Enter your password" minlength="6" required><button type="button" class="password-toggle" data-target="login-password">Show</button></div><small class="field-error"></small></label><div class="form-row"><label class="check"><input type="checkbox"> <span>Remember me</span></label><a href="#" id="forgot-password">Forgot password?</a></div><button class="btn btn-full" type="submit">Sign in <span>→</span></button></form><div class="auth-separator"><span>New to Blogify?</span></div><a class="btn btn-ghost btn-full" href="register.html">Create an account</a></section><p class="auth-foot">© 2026 Blogify · Frontend demo</p></main><div id="toast" class="toast" role="status"></div><script src="js/app.js"></script></body></html>
